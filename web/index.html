  <script>

        a = function () {

          if (!f) {
            return;
          }
          if (
            !/Android|webOS|iPhone|iPod|BlackBerry|SymbianOS|Windows Phone/i.test(

            )

          }

        return;
      }
      c.addEventListener(b, a, false);
      d.addEventListener("DOMContentLoaded", a, false);
    })(document, window);
  </script>
