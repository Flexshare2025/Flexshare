name: Deploy Spring Boot to EC2

on:
  push:
    branches:
      - flexShareServer

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSH_PRIVATE_KEY: ${{ secrets.AWS_EC2_SSH_KEY_SPRINGBOOT }}
      EC2_HOST: ${{ secrets.AWS_EC2_HOST_SPRINGBOOT }}
      EC2_USER: ${{ secrets.AWS_EC2_USER_SPRINGBOOT }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup JDK (for Maven build)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'maven'

    - name: Build JAR using the nested pom
      run: |
        POM_PATH="Group-Work-for-COMPX527/Flex Share Server/Leon's folder/pom.xml"
        echo "Building with POM: $POM_PATH"
        # use -f to point to the nested pom
        mvn -B -f "$POM_PATH" -DskipTests clean package

    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/aws.pem
        chmod 600 ~/.ssh/aws.pem
        ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

    - name: Find built JAR and copy to EC2
      run: |
        JAR_PATH=$(ls "Group-Work-for-COMPX527/Flex Share Server/Leon's folder/target/"*.jar 2>/dev/null | grep -v 'original' | head -n 1 || true)
        if [ -z "$JAR_PATH" ]; then
          echo "ERROR: No JAR found at the expected target path."
          echo "ls output:"
          ls -la "Group-Work-for-COMPX527/Flex Share Server/Leon's folder/target/" || true
          exit 1
        fi
        echo "Found JAR: $JAR_PATH"
        scp -i ~/.ssh/aws.pem -o StrictHostKeyChecking=no "$JAR_PATH" $EC2_USER@$EC2_HOST:/home/ubuntu/app/member-service.jar

    - name: Restart Spring Boot on EC2
      run: |
        ssh -i ~/.ssh/aws.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'EOF'
          set -e
          mkdir -p /home/ubuntu/app
          echo "Stopping old process (if any)..."
          pkill -f 'java -jar' || true


          # sudo apt update && sudo apt install -y default-jre

          echo "Starting member-service..."
          nohup java -jar /home/ubuntu/app/member-service.jar > /home/ubuntu/app/app.log 2>&1 &
          echo "Started."
        EOF
