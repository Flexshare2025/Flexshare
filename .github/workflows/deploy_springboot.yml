name: Deploy Spring Boot to EC2

on:
  push:
    branches:
      - flexShareServer

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSH_PRIVATE_KEY: ${{ secrets.AWS_EC2_SSH_KEY_SPRINGBOOT }}
      EC2_HOST: ${{ secrets.AWS_EC2_HOST_SPRINGBOOT }}
      EC2_USER: ${{ secrets.AWS_EC2_USER_SPRINGBOOT }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/aws.pem
        chmod 600 ~/.ssh/aws.pem
        ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

    - name: Deploy to EC2
      run: |
        ssh -i ~/.ssh/aws.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'EOF'
          echo "Killing old Spring Boot process..."
          pkill -f 'java -jar' || echo "No process found"

          echo "Pulling latest code..."
          cd /home/ubuntu/app
          git pull origin flexShareServer

          echo "Building member-service module..."
          cd wholeproject
          mvn -pl member-service -am clean package -DskipTests

          echo "Starting member-service..."
          cd member-service
          JAR_NAME=$(ls target/*.jar | grep -v 'original' | head -n 1)
          nohup java -jar "$JAR_NAME" > app.log 2>&1 &
        EOF
